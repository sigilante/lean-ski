[package]
name = "ski-air"
version = "0.1.0"
edition = "2021"

[dependencies]
p3-air = "0.8.0"
p3-field = "0.8.0"
p3-matrix = "0.8.0"
p3-baby-bear = "0.8.0"
p3-uni-stark = "0.8.0"
p3-batch-stark = "0.8.0"
p3-lookup = "0.8.0"
p3-fri = "0.8.0"
p3-merkle-tree = "0.8.0"
p3-commit = "0.8.0"
p3-challenger = "0.8.0"
p3-dft = "0.8.0"
p3-symmetric = "0.8.0"
p3-util = "0.8.0"
rand = "0.10"
chacha20 = { version = "0.10", default-features = false, features = ["rng"] }
serde = "1"
postcard = { version = "1", features = ["alloc"] }

[profile.release]
debug = false
