name: Coverage
# The kernel-checked coverage project is the costliest job (up to two
# hours), so it does not run on every push: nightly, on demand, and on
# pushes and pull requests that touch the coverage project or its build.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "coverage/**"
      - "scripts/build-coverage.sh"
      - "scripts/coverage.ski"
      - ".github/workflows/coverage.yml"
      - "lean-toolchain"
  pull_request:
    paths:
      - "coverage/**"
      - "scripts/build-coverage.sh"
      - "scripts/coverage.ski"
      - ".github/workflows/coverage.yml"
      - "lean-toolchain"
# A new push to a branch cancels its older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The front end's coverage of SKIjack, checked in the kernel: its own
  # project, built one module at a time, every module and both audits.  The
  # largest module, the checker's verdict on scripts/coverage.ski (a
  # unification skijack never finishes, refused at its recursion limit),
  # peaks at about 13 GiB, and two more at 6.7 and 7.2; a public runner has
  # 15 GiB, and swap is the margin.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Swap is the margin over the runner's 15 GiB for CoverageChecks' 13,
      # and systemd-oomd is stopped so pressure pages out instead of
      # killing the build.
      - name: Swap, as a margin
        run: |
          sudo systemctl stop systemd-oomd || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      # The last good builds: the core's, which the core's CI saves, and the
      # coverage project's own.  Lake rebuilds only what changed.
      - name: Restore the core's build
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: core-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: core-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Restore the coverage build
        uses: actions/cache/restore@v4
        with:
          path: coverage/.lake/build
          key: coverage-${{ runner.os }}-${{ hashFiles('coverage/lean-toolchain', 'coverage/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: coverage-${{ runner.os }}-${{ hashFiles('coverage/lean-toolchain', 'coverage/lake-manifest.json') }}-
      - name: Build the coverage project (elaborates both audit manifests)
        id: build
        run: ./scripts/build-coverage.sh
      - name: Save the coverage build
        if: always() && steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: coverage/.lake/build
          key: coverage-${{ runner.os }}-${{ hashFiles('coverage/lean-toolchain', 'coverage/lake-manifest.json') }}-${{ github.sha }}
