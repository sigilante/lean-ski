name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Ski.ZK.Generic peaks at about 11 GiB (the kernel's normal forms in
      # vdm_n0–3); a private repository's runner has 7.8.  Swap carries the
      # peak, and systemd-oomd is stopped so pressure pages out instead of
      # killing the runner.  The swap file shares the runner's disk with the
      # toolchain, so the preinstalled toolchains this project never uses go
      # first.
      - name: Free disk space
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /mnt
      - name: Swap, for Ski.ZK.Generic
        run: |
          sudo systemctl stop systemd-oomd || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      # The last good build's artifacts: Lake rebuilds only the modules whose
      # sources or imports changed (it compares hashes, not timestamps).
      - name: Restore the build
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: core-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: core-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      # Alone, so no other module competes for memory at its peak.
      - name: Build Ski.ZK.Generic alone
        run: lake build Ski.ZK.Generic
      - name: Build (elaborates the audit manifest)
        id: build
        run: lake build
      - name: Save the build
        if: always() && steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: core-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
      - name: Gates
        run: ./scripts/gates.sh
      - name: Conformance against the reference reducer's counts
        run: lake exe main
  # The front end's coverage of SKIjack, checked in the kernel: its own
  # project, built one module at a time.  The largest module, the checker's
  # verdict on scripts/coverage.ski (a unification skijack never finishes,
  # refused at its recursion limit), peaks at about 13 GiB, and two more
  # pass 6.5; a private repository's runner has 7.8, so CI skips those
  # three (--ci).
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # A private repository's runner has 7.8 GiB.  The heavy modules
      # (CoverageChecks at 13 GiB, AsciiDigits and its checks at 6.7 and 7.2)
      # and their audit (AuditHeavy) are skipped; build-coverage.sh without
      # --ci builds them locally.  The rest peak under 5.7 GiB; swap is a
      # margin for those, and systemd-oomd is stopped so pressure pages out
      # instead of killing the build.
      - name: Swap, as a margin
        run: |
          sudo systemctl stop systemd-oomd || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      - name: Build the coverage project, but its heavy modules (elaborates its audit manifest)
        run: ./scripts/build-coverage.sh --ci
  # The zero-knowledge layer: traversability and fingerprints, over Pure
  # Nock and Mathlib.  Mathlib comes from its cache.
  zk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib's cache
        working-directory: zk
        run: lake exe cache get
      - name: Build the zk project (elaborates its audit manifest)
        working-directory: zk
        run: lake build
