name = "SkiCoverage"
version = "0.1.0"
defaultTargets = ["SkiCoverage"]

# The front end's coverage of SKIjack, checked in the kernel: every
# generated suite, the refusals and the checker's checks.  Separate from
# the core so the core builds in minutes and within a CI runner's memory;
# generated by scripts/emit.py.
[[require]]
name = "Ski"
path = ".."

[[lean_lib]]
name = "SkiCoverage"
